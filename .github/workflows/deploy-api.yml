# Deploys the league service (server/) to Cloudflare on every push to main
# that touches it. Needs two repo secrets: CLOUDFLARE_API_TOKEN (Workers
# edit) and CLOUDFLARE_ACCOUNT_ID.
name: deploy-api
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-api.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc -p server/tsconfig.json
      - name: Deploy
        run: npx wrangler deploy --config server/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
